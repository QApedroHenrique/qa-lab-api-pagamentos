version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ferramentas-de-teste:
        patterns: ["jest*", "newman*", "ajv*", "axios"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
