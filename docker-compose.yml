# Uso:
#   docker compose up -d db        -> só o banco (para rodar a API e os testes pelo Node)
#   docker compose up -d --build   -> banco + API completa em http://localhost:3000

services:
  db:
    image: postgres:16-alpine
    container_name: qa-lab-pagamentos-db
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: pagamentos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d pagamentos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dados-postgres:/var/lib/postgresql/data

  api:
    build: .
    container_name: qa-lab-pagamentos-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://qa:qa@db:5432/pagamentos
      PORT: 3000
      # Ambiente de DEMONSTRAÇÃO: usa os segredos fictícios padrão.
      # A imagem roda com NODE_ENV=production e, nesse modo, a API se recusa a iniciar
      # sem JWT_SECRET, API_CLIENT_SECRET e PIX_WEBHOOK_SECRET próprios (RN-15).
      NODE_ENV: development
    ports:
      - "3000:3000"

volumes:
  dados-postgres:
